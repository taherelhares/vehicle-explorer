name: deploy

# Every push to main becomes a running container. The image is tagged with the commit
# SHA rather than "latest", so what is deployed is always traceable to a commit and a
# rollback is a redeploy of an earlier tag rather than a rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two deploys racing to restart the same container would interleave. Later wins.
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: vehicle-explorer

permissions:
  # id-token is what lets the job request an OIDC token from GitHub and exchange it for
  # temporary AWS credentials. No secret access key is stored anywhere in this repo.
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Roll the container on EC2
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # SSM rather than SSH: no inbound port, no key pair, and the call is
          # authorised by the same role that pushed the image.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters "commands=[\"/usr/local/bin/deploy.sh $IMAGE\"]" \
            --query "Command.CommandId" \
            --output text)

          # The waiter fails the step on a non-zero exit, but it fails silently, so the
          # invocation is fetched either way and the instance's own output is printed.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy command finished with status $STATUS"
            exit 1
          fi

      - name: Verify the deployment is serving
        run: |
          set -euo pipefail

          # A green build that pushed a broken image is worse than a red one. This asks
          # the public URL the same question a user would.
          for attempt in $(seq 1 10); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${{ vars.SITE_URL }}/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            echo "Attempt $attempt: /health returned $CODE"
            sleep 10
          done

          echo "::error::/health never returned 200"
          exit 1
